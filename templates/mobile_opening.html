{% load static %}
{% if not form.errors %}
<div class="mobile-opening" id="mobile-opening" hidden>
    <img class="mobile-opening-photo" src="{% static 'images/mobile-opening.png' %}" alt="" fetchpriority="high">
    <div class="mobile-opening-identity">
        <svg class="mobile-opening-logo" viewBox="0 0 100 110" aria-hidden="true">
            <defs><linearGradient id="fruit-green" x2="1" y2="1"><stop stop-color="#94c952"/><stop offset="1" stop-color="#297b38"/></linearGradient><linearGradient id="fruit-gold" x2="1" y2="1"><stop stop-color="#ffe783"/><stop offset="1" stop-color="#edb72c"/></linearGradient></defs>
            <path d="M47 35C22 24 12 45 12 66c0 24 15 36 35 35 23-1 34-18 31-38-2-17-16-31-31-28Z" fill="url(#fruit-green)" stroke="white" stroke-width="3"/>
            <path d="M46 40C39 23 42 13 51 5M47 23C27 25 22 14 24 10c17-4 26 2 23 13ZM49 18C50 6 66 4 71 8c-2 13-14 17-22 10Z" fill="#a6d86f" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="65" cy="52" r="23" fill="url(#fruit-gold)" stroke="white" stroke-width="3"/>
            <path d="M59 34c-5 1-8 5-9 9" fill="none" stroke="#fff6cf" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <h1>CalamanSense</h1>
        <p>Smart Calamansi<br>Quality Assessment</p>
    </div>
    <div class="mobile-opening-footer"><p>For farmers. For better harvests.<br>A smarter tomorrow.</p><button type="button" id="opening-continue">Tap to continue <span aria-hidden="true">&rarr;</span></button><small class="opening-swipe-hint">or swipe up to explore</small></div>
</div>
{% include 'mobile_onboarding.html' %}
<script>
(() => {
    const opening = document.getElementById('mobile-opening');
    const onboarding = document.getElementById('mobile-onboarding');
    const card = document.querySelector('.auth-card');
    const mobile = window.matchMedia('(max-width: 760px)');
    const slides = Array.from(onboarding.querySelectorAll('[data-slide]'));
    const dots = Array.from(onboarding.querySelectorAll('[data-page]'));
    const next = document.getElementById('onboarding-next');
    const skip = document.getElementById('onboarding-skip');
    let page = 0;
    let busy = false;
    let closed = false;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const viewport = onboarding.querySelector('.onboarding-slides');
    async function animate(element, frames, duration = 360) {
        if (reducedMotion.matches || !element.animate) return;
        try { await element.animate(frames, {duration, easing: 'cubic-bezier(.22,1,.36,1)'}).finished; } catch (_) {}
    }
    let openingSeen = false;
    let onboardingSeen = false;
    try {
        openingSeen = sessionStorage.getItem('calamansense-opening-seen') === '1';
        onboardingSeen = sessionStorage.getItem('calamansense-onboarding-seen') === '1';
    } catch (_) {}
    if (!mobile.matches || onboardingSeen) return;
    card.inert = true;
    document.body.classList.add('opening-active');
    function remember(key) { try { sessionStorage.setItem(key, '1'); } catch (_) {} }
    async function showPage(index, initial = false) {
        if (busy || closed || index < 0 || index >= slides.length || (!initial && index === page)) return;
        busy = true;
        const direction = index > page ? 1 : -1;
        if (!initial) await animate(slides[page], [{opacity: 1, transform: 'translateX(0)'}, {opacity: 0, transform: `translateX(${-direction * 55}px)`}], 160);
        if (closed) { busy = false; return; }
        page = index;
        slides.forEach((slide, i) => { slide.hidden = i !== page; });
        dots.forEach((dot, i) => { if (i === page) dot.setAttribute('aria-current', 'step'); else dot.removeAttribute('aria-current'); });
        next.textContent = page === 2 ? 'Get Started' : 'Next';
        skip.hidden = page === 2;
        slides[page].querySelector('h2').focus({preventScroll: true});
        await animate(slides[page], [{opacity: 0, transform: `translateX(${direction * 65}px) scale(.97)`}, {opacity: 1, transform: 'translateX(0) scale(1)'}]);
        busy = false;
    }
    async function showOnboarding() {
        if (busy || closed) return;
        busy = true;
        if (!opening.hidden) await animate(opening, [{opacity: 1, transform: 'translateY(0)'}, {opacity: 0, transform: 'translateY(-35px)'}], 300);
        if (closed) { busy = false; return; }
        opening.hidden = true;
        onboarding.hidden = false;
        remember('calamansense-opening-seen');
        busy = false;
        showPage(0, true);
    }
    function dismiss(completed) {
        closed = true;
        opening.hidden = true;
        onboarding.hidden = true;
        card.inert = false;
        document.body.classList.remove('opening-active');
        if (completed) {
            remember('calamansense-opening-seen');
            remember('calamansense-onboarding-seen');
        }
        const heading = document.querySelector('.auth-heading h2');
        heading.tabIndex = -1;
        heading.focus({preventScroll: true});
    }
    document.getElementById('opening-continue').addEventListener('click', showOnboarding);
    next.addEventListener('click', () => { if (page < 2) showPage(page + 1); else dismiss(true); });
    skip.addEventListener('click', () => dismiss(true));
    dots.forEach(dot => dot.addEventListener('click', () => showPage(Number(dot.dataset.page))));
    // Lock gestures to their intended axis so vertical reading remains natural.
    function swipe(surface, axis, onSwipe) {
        let start = null;
        surface.addEventListener('pointerdown', event => {
            if (!event.isPrimary || event.button !== 0 || busy || closed || event.target.closest('button')) return;
            start = {x: event.clientX, y: event.clientY, id: event.pointerId};
            surface.setPointerCapture(event.pointerId);
        });
        surface.addEventListener('pointerup', event => {
            if (!start || start.id !== event.pointerId) return;
            const dx = event.clientX - start.x;
            const dy = event.clientY - start.y;
            start = null;
            const distance = axis === 'x' ? dx : dy;
            const cross = axis === 'x' ? dy : dx;
            if (Math.abs(distance) >= 45 && Math.abs(distance) > Math.abs(cross) * 1.3) onSwipe(distance);
        });
        surface.addEventListener('pointercancel', () => { start = null; });
        surface.addEventListener('lostpointercapture', () => { start = null; });
        surface.addEventListener('dragstart', event => event.preventDefault());
    }
    swipe(viewport, 'x', distance => showPage(page + (distance < 0 ? 1 : -1)));
    swipe(opening, 'y', distance => { if (distance < 0) showOnboarding(); });
    onboarding.addEventListener('keydown', event => {
        if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
        event.preventDefault();
        showPage(page + (event.key === 'ArrowRight' ? 1 : -1));
    });
    mobile.addEventListener('change', event => { if (!event.matches) dismiss(false); });
    if (openingSeen) showOnboarding();
    else {
        opening.hidden = false;
        document.getElementById('opening-continue').focus({preventScroll: true});
    }
})();
</script>
{% endif %}
