{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalamanSense</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <script>
        // Apply dark mode early to prevent flickering
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block navigation %}
    {% if user.is_authenticated %}
    <header class="nav-bar">
        <div class="logo">
            <a href="{% url 'dashboard' %}">
                <span class="material-symbols-outlined">eco</span>CalamanSense
            </a>
        </div>
        
        <button class="mobile-menu-btn" aria-label="Toggle navigation">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <nav class="nav-links">
            <a href="{% url 'dashboard' %}"><span class="material-symbols-outlined">dashboard</span> Dashboard</a>
            <a href="{% url 'upload' %}"><span class="material-symbols-outlined">upload_file</span> Upload</a>
            <a href="{% url 'reports_overview' %}"><span class="material-symbols-outlined">analytics</span> Reports</a>
            <a href="{% url 'settings' %}"><span class="material-symbols-outlined">settings</span> Settings</a>
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="logout-btn" style="background: none; border: none; color: inherit; font: inherit; cursor: pointer; text-align: left;">
                    <span class="material-symbols-outlined">logout</span> Logout
                </button>
            </form>
        </nav>
    </header>
    {% endif %}

    {% endblock %}
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.querySelector('.mobile-menu-btn');
            const navLinks = document.querySelector('.nav-links');
            
            if(menuBtn) {
                menuBtn.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                    // Toggle icon between menu and close
                    const icon = menuBtn.querySelector('span');
                    if (navLinks.classList.contains('active')) {
                        icon.textContent = 'close';
                    } else {
                        icon.textContent = 'menu';
                    }
                });
            }
        });

        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                iconElement.textContent = 'visibility';
            }
        }
    </script>
</body>
</html>
